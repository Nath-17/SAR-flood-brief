repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace      # removes trailing spaces
      - id: end-of-file-fixer        # ensures files end with a newline
      - id: check-yaml               # YAML syntax (CI, docker compose)
      - id: check-toml               # TOML syntax (pyproject.toml)
      - id: check-merge-conflict     # forgotten <<<<<<< markers
      - id: check-added-large-files  # blocks large files (GeoTIFF!)
        args: ["--maxkb=1000"]

  # Ruff: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
